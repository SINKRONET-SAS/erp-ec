name: Pruebas integradas y dependencias

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  gobierno:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/verify-governance.cjs --git
      - run: node --test scripts/test-governance.cjs
      - run: node scripts/verify-project-state.cjs
      - run: node --test scripts/test-project-state.cjs
      - run: python scripts/test-di25-demo-runner.py
      - run: python scripts/render-di25-matrix.py --check
      - run: python scripts/check-module-versions.py --check

  suite-linux:
    name: Suite integrada (imagen sin fuentes montadas)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test-linux-runner.py
      - name: Construir imagen y ejecutar todas las pruebas
        run: bash deployment/linux/run-tests.sh

  perfiles:
    name: Arranque real de imagen ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [customer, controller]
    steps:
      - uses: actions/checkout@v4
      - name: Construir perfil
        run: docker build --build-arg ERPEC_PROFILE=${{ matrix.profile }} -f deployment/linux/Dockerfile -t erpec-linux-${{ matrix.profile }}:phase04 .
      - name: Probar arranque, interfaz, aislamiento y recreación
        run: python scripts/verify-linux.py --profile ${{ matrix.profile }}
      - name: Conservar resultado sin credenciales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ matrix.profile }}
          path: .cache/linux/*/result.json

  dependencias:
    name: Auditoría de dependencias
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit sobre el lock de producción
        run: |
          pip install pip-audit
          pip-audit -r deployment/linux/requirements-linux.lock --no-deps --disable-pip
